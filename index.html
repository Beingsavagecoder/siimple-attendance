<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Tracker</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css">

</head>

<body>

  <h1> 🧘𝗦𝗶𝗶𝗺𝗽𝗹𝗲 Attendance🧘 </h1>


  <div class="add">

    <input id="subjectName" placeholder="Subject">

    <input id="attendanceValue" type="number" value="1" min="0.25" step="0.25">

    <button id="addSubjectBtn">
      Add
    </button>

  </div>


  <table>

    <thead>

      <tr>

        <th>Subject</th>

        <th>Value</th>

        <th>Present</th>

        <th>Total</th>

        <th>%</th>

        <th>Actions</th>

      </tr>

    </thead>

    <tbody id="subjectContainer">

    </tbody>

  </table>

  <template id="subjectTemplate">

    <tr>

      <td class="subject-title"></td>

      <td class="attendance-value"></td>

      <td class="present-count"></td>

      <td class="total-count"></td>

      <td class="percentage"></td>

      <td class="actions">
        <div class="action-left">
          <button class="present-btn">✓</button>
          <button class="absent-btn">✗</button>
          <button class="calendar-btn">📅</button>
        </div>

        <button class="delete-btn">🗑</button>
      </td>

    </tr>

  </template>

  <div class="summary">

    <span>Present :
      <b id="overallPresent">0</b>
    </span>

    <span>Total :
      <b id="overallTotal">0</b>
    </span>

    <span>Attendance :
      <b id="overallPercentage">0%</b>
    </span>

  </div>


  <div id="calendarModal" class="modal">

    <div class="modal-content">

      <button onclick="closeCalendar()">✖</button>

      <div class="calendar-header">

        <button onclick="prevMonth()">◀</button>

        <h2 id="monthYear"></h2>

        <button onclick="nextMonth()">▶</button>

      </div>

      <div id="calendar" class="calendar"></div>

    </div>

  </div>

  <script src="js/scripts.js"></script>

</body>

</html>
