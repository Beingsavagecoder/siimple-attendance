<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Tracker</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css">

</head>

<body>

  <h1> 🧘𝗦𝗶𝗶𝗺𝗽𝗹𝗲 Attendance🧘 </h1>


  <div class="add">

    <input id="subjectName" placeholder="Subject">

    <input id="attendanceValue" placeholder="attendance-count per present" type="number" value="1" min="0.25"
      step="0.25">

    <button id="addSubjectBtn">
      <span style="
    font-size: 30px;
    font-weight: 1000;
    padding-bottom: 2px;
    color: #2d6cdf;
    display: inline-flex;
    align-items: center;
    justify-content: center;

    width: 25px;
    height: 25px;

    border-radius: 50%;
    background: #eef4ff;
    border: 1px solid #e7ea1d
;
    cursor: pointer;
    transition: .2s;
">
        +
      </span>
    </button>

  </div>


  <table>

    <thead>

      <tr>

        <th>Subject</th>



        <th>Actions</th>
        <th>Hrs(periods)</th>

        <th>Present</th>

        <th>Total</th>

        <th>%</th>

      </tr>

    </thead>

    <tbody id="subjectContainer">

    </tbody>

  </table>

  <template id="subjectTemplate">

    <tr>

      <td class="subject-title"></td>



      <td class="actions">
        <div class="action-left">
          <button class="present-btn">✓</button>
          <button class="absent-btn">✗</button>
          <button class="calendar-btn">📅</button>
        </div>
      </td>
      <td class="attendance-value"></td>

      <td class="present-count"></td>

      <td class="total-count"></td>

      <td class="percentage"></td>
      <td></td>
      <td>
        <button class="delete-btn">🗑</button>
      </td>
    </tr>

  </template>

  <div class="summary">

    <span>Present periods :
      <b id="overallPresent">0</b>
    </span>

    <span>Total periods:
      <b id="overallTotal">0</b>
    </span>

    <span>Attendance overall:
      <b id="overallPercentage">0%</b>
    </span>

  </div>


  <div id="calendarModal" class="modal">

    <div class="modal-content">

      <div><button class="close-btn" onclick="closeCalendar()">
          ✕
        </button>
      </div>

      <div class="calendar-header">

        <button onclick="prevMonth()">◀</button>

        <h2 id="monthYear"></h2>

        <button onclick="nextMonth()">▶</button>

      </div>

      <div id="calendar" class="calendar"></div>

    </div>

  </div>

  <script src="js/scripts.js"></script>

</body>

</html>
